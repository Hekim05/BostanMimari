name: Testler
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python tests/calistir.py
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hata-ekranlari
          path: tests/cikti/
